name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual "Run workflow" button in the Actions tab — redeploy on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    # Deploy on a push to main or a manual run; never on pull requests.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first: this generates build/server/wrangler.json (carrying the
      # Worker name) and the deploy redirect that the commands below read.
      - run: npm run build
      # Deploy with the project's own pinned wrangler (npx resolves the local
      # 4.136.x in node_modules — not an auto-installed, incompatible version).
      # On the first run this creates the Worker; the app reports "integration
      # unavailable" only until the secrets below are set in this same run.
      - name: Deploy Worker
        run: npx wrangler deploy
      # Set runtime secrets on the now-existing Worker, straight from GitHub
      # secrets — so no local `wrangler secret put` is ever needed. printf (no
      # trailing newline) keeps the values exact.
      - name: Set Worker secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL
          printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler secret put SUPABASE_ANON_KEY
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "production" | npx wrangler secret put ENVIRONMENT
